name: Preview Build

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  preview-build:
    runs-on: ubuntu-latest
    name: Build & Validate Preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: antra/package.json

      - name: Install dependencies
        working-directory: antra
        run: npm ci

      - name: Compile SCSS
        working-directory: antra
        run: npm run sass

      - name: Verify CSS output exists and is non-empty
        run: |
          if [ ! -f "antra/assets/css/main.css" ]; then
            echo "::error::main.css was not generated by SCSS compilation"
            exit 1
          fi
          CSS_SIZE=$(wc -c < antra/assets/css/main.css)
          echo "main.css size: ${CSS_SIZE} bytes"
          if [ "$CSS_SIZE" -lt 1000 ]; then
            echo "::error::main.css is suspiciously small (${CSS_SIZE} bytes) — compilation may have failed silently"
            exit 1
          fi
          echo "✅ main.css compiled successfully (${CSS_SIZE} bytes)"

      - name: Scan for placeholder content
        run: |
          echo "Scanning for REPLACE-ME placeholders..."
          REPLACE_ME=$(grep -rni "REPLACE-ME" antra/ --include="*.html" | grep -v "<!--" || true)
          if [ -n "$REPLACE_ME" ]; then
            echo "::warning::Placeholder images found (REPLACE-ME):"
            echo "$REPLACE_ME"
          fi

          echo "Scanning for Lorem ipsum..."
          LOREM=$(grep -rni "lorem ipsum" antra/ --include="*.html" | grep -v "<!--" || true)
          if [ -n "$LOREM" ]; then
            echo "::warning::Lorem ipsum placeholder text found:"
            echo "$LOREM"
          fi

          echo "Placeholder scan complete."

      - name: Validate ScrollSmoother wrapper presence
        run: |
          echo "Checking for required GSAP ScrollSmoother wrapper on all pages..."
          MISSING_WRAPPER=""
          for file in antra/*.html; do
            if ! grep -q "antra-smooth-wrapper" "$file"; then
              MISSING_WRAPPER="${MISSING_WRAPPER}\n  - ${file} (missing #antra-smooth-wrapper)"
            fi
            if ! grep -q "antra-smooth-content" "$file"; then
              MISSING_WRAPPER="${MISSING_WRAPPER}\n  - ${file} (missing #antra-smooth-content)"
            fi
          done
          if [ -n "$MISSING_WRAPPER" ]; then
            echo "::error::Critical: GSAP ScrollSmoother wrapper missing in these files:"
            echo -e "$MISSING_WRAPPER"
            exit 1
          fi
          echo "✅ ScrollSmoother wrapper present on all pages"

      - name: Validate preloader presence
        run: |
          echo "Checking for preloader element on all pages..."
          MISSING_PRELOADER=""
          for file in antra/*.html; do
            if ! grep -q 'id="preloader"' "$file"; then
              MISSING_PRELOADER="${MISSING_PRELOADER}\n  - ${file}"
            fi
          done
          if [ -n "$MISSING_PRELOADER" ]; then
            echo "::warning::Preloader element missing in:"
            echo -e "$MISSING_PRELOADER"
          else
            echo "✅ Preloader present on all pages"
          fi

      - name: Check required vendor JS files
        run: |
          REQUIRED_JS=(
            "antra/assets/js/vendor/jquary-3.7.1.min.js"
            "antra/assets/js/vendor/bootstrap-bundle.js"
            "antra/assets/js/vendor/gsap.min.js"
            "antra/assets/js/vendor/scroll-trigger.min.js"
            "antra/assets/js/vendor/scroll-smoother.js"
            "antra/assets/js/vendor/swiper.min.js"
            "antra/assets/js/main.js"
          )
          MISSING_JS=""
          for jsfile in "${REQUIRED_JS[@]}"; do
            if [ ! -f "$jsfile" ]; then
              MISSING_JS="${MISSING_JS}\n  - ${jsfile}"
            fi
          done
          if [ -n "$MISSING_JS" ]; then
            echo "::error::Required vendor JS files missing:"
            echo -e "$MISSING_JS"
            exit 1
          fi
          echo "✅ All required vendor JS files present"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: antra-preview-${{ github.sha }}
          path: antra/
          retention-days: 7
          if-no-files-found: error
